---
name: Check Embedded Editor Compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check_and_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare embedded editor with latest upstream release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh api repos/exelearning/exelearning/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
          CURRENT=$(cat .editor-version 2>/dev/null || echo "")
          echo "Current embedded fallback: $CURRENT"
          echo "Latest upstream editor: $LATEST"
          if [ -z "$LATEST" ] || [ "$LATEST" = "$CURRENT" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        if: steps.check.outputs.build == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Build compatibility package
        if: steps.check.outputs.build == 'true'
        env:
          EXELEARNING_EDITOR_REPO_URL: https://github.com/exelearning/exelearning.git
          EXELEARNING_EDITOR_REF: ${{ steps.check.outputs.tag }}
          EXELEARNING_EDITOR_REF_TYPE: tag
          APP_VERSION: ${{ steps.check.outputs.tag }}
        run: |
          make build-editor
          make package RELEASE=embedded-check-${{ steps.check.outputs.tag }}

      - name: Upload compatibility package
        if: steps.check.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: seleda-scorm-embedded-check-${{ steps.check.outputs.tag }}
          path: mod_exescorm-embedded-check-${{ steps.check.outputs.tag }}.zip

      - name: No upstream change
        if: steps.check.outputs.build != 'true'
        run: echo "No newer upstream embedded editor needs compatibility review."
