---
name: Check Embedded Seleda Compatibility

on:
  workflow_dispatch:
    inputs:
      seleda_ref:
        description: "Seleda Studio ref to test (defaults to .seleda-editor-ref)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check_and_build:
    runs-on: ubuntu-latest
    env:
      SELEDA_STUDIO_TOKEN: ${{ secrets.SELEDA_STUDIO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Seleda Studio ref
        run: |
          INPUT_REF="${{ github.event.inputs.seleda_ref }}"
          if [ -z "$INPUT_REF" ]; then
            INPUT_REF="$(cat .seleda-editor-ref)"
          fi
          echo "SELEDA_STUDIO_REF=$INPUT_REF" >> "$GITHUB_ENV"
          echo "APP_VERSION=compat-$INPUT_REF" >> "$GITHUB_ENV"
          echo "Testing embedded Seleda ref: $INPUT_REF"

      - name: Build embedded Seleda editor
        run: sh scripts/build-seleda-editor.sh

      - name: Verify embedded bundle
        run: |
          test -f dist/static/index.html
          test -d dist/static/app
          test -d dist/static/files
          test -d dist/static/libs

      - name: Create compatibility package
        run: make package RELEASE=embedded-seleda-check

      - name: Upload compatibility package
        uses: actions/upload-artifact@v4
        with:
          name: seleda-scorm-embedded-seleda-check
          path: mod_seledascorm-embedded-seleda-check.zip
