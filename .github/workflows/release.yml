---
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release label for package name (e.g. 1.2.3 or 1.2.3-beta)"
        required: false
        default: ""
      seleda_ref:
        description: "Seleda Studio ref to embed (branch, tag, or commit)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    env:
      SELEDA_STUDIO_TOKEN: ${{ secrets.SELEDA_STUDIO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW_TAG="${GITHUB_REF##*/}"
            VERSION_TAG="${RAW_TAG#v}"
            SELEDA_REF="$(cat .seleda-editor-ref)"
            echo "RELEASE_TAG=${VERSION_TAG}" >> $GITHUB_ENV
            echo "SELEDA_STUDIO_REF=${SELEDA_REF}" >> $GITHUB_ENV
            echo "APP_VERSION=${VERSION_TAG}" >> $GITHUB_ENV
          else
            INPUT_RELEASE="${{ github.event.inputs.release_tag }}"
            if [ -z "$INPUT_RELEASE" ]; then
              INPUT_RELEASE="manual-$(date +%Y%m%d)-${GITHUB_SHA::7}"
            fi
            INPUT_SELEDA_REF="${{ github.event.inputs.seleda_ref }}"
            if [ -z "$INPUT_SELEDA_REF" ]; then
              INPUT_SELEDA_REF="$(cat .seleda-editor-ref)"
            fi
            echo "RELEASE_TAG=${INPUT_RELEASE}" >> $GITHUB_ENV
            echo "SELEDA_STUDIO_REF=${INPUT_SELEDA_REF}" >> $GITHUB_ENV
            echo "APP_VERSION=${INPUT_RELEASE}" >> $GITHUB_ENV
          fi

      - name: Create package
        run: make package RELEASE=${RELEASE_TAG}

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: seleda-scorm-${{ env.RELEASE_TAG }}
          path: mod_seledascorm-${{ env.RELEASE_TAG }}.zip

      - name: Upload ZIP to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: mod_seledascorm-${{ env.RELEASE_TAG }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
